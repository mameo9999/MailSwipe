name: Build prototype

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile for iOS Simulator
        run: |
          xcodebuild \
            -project MailSwipe.xcodeproj \
            -scheme MailSwipe \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project MailSwipe.xcodeproj \
            -scheme MailSwipe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/MailSwipe.app Payload/
          zip -r MailSwipe-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MailSwipe-unsigned
          path: MailSwipe-unsigned.ipa
          retention-days: 7

