name: MailSwipe
options:
  bundleIdPrefix: jp.ryuya
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
packages:
  MailCore2:
    url: https://github.com/MailCore/mailcore2
    branch: master
targets:
  MailSwipe:
    type: application
    platform: iOS
    sources:
      - path: MailSwipe
    dependencies:
      - package: MailCore2
      - sdk: Security.framework
      - sdk: QuickLook.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.ryuya.mailswipe
        PRODUCT_NAME: MailSwipe
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: MailSwipe/Info.plist
      properties:
        CFBundleDisplayName: MailSwipe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  MailSwipeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MailSwipeTests
    dependencies:
      - target: MailSwipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.ryuya.mailswipe.tests
